services:
  vdoninja:
    build: .
    image: vdoninja-offline:local
    # Match the Linux account that owns the private key; never chmod it 644.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
    restart: unless-stopped
    cpus: 2
    init: true
